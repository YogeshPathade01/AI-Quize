<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="assets/exo_igniter.jpeg" alt="Igniter Quiz Logo" class="logo-icon">
    <div class="logo-text">
      <div class="logo-title">EXO IGNITER</div>
      <div class="logo-sub">AI-Powered Assessment</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ng-container *ngFor="let section of sections">
      <div class="nav-section-label" *ngIf="getItemsBySection(section).length">{{ section }}</div>
      <a
        *ngFor="let item of getItemsBySection(section)"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
      </a>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      <span>🚪</span> Logout
    </button>
  </div>
</aside>
