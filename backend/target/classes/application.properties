# ── Server ──────────────────────────────────────────────
server.port=8081

# ── App Info ────────────────────────────────────────────
spring.application.name=igniter-quiz-backend
# DATABASE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# DRIVER
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ── JWT ─────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:IgniterQuizSuperSecretKeyForJWTTokenSigningMustBe256BitsLong1234567890}
app.jwt.expiration-ms=86400000

# ── CORS ────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:4200

# ── Logging ─────────────────────────────────────────────
logging.level.com.igniterquiz=DEBUG


# ── Mail Configuration (Dummy) ──────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true




# ── Google OAuth ─────────────────────────────────────────
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ── Gemini AI ───────────────────────────────────────────
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
gemini.api.key=${GEMINI_API_KEY:}
